<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} · ClipMoa</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root { --fg: #202323; --muted: #5f6666; --bg: #ffffff; --line: #ececec; --accent: #e5484d; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #ececec; --muted: #a3a9a9; --bg: #151616; --line: #2a2c2c; --accent: #ff7a7a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  header { border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 16px; padding-top: 16px; padding-bottom: 16px; }
  header .name { color: var(--fg); font-weight: 700; text-decoration: none; }
  nav { margin-left: auto; display: flex; gap: 16px; font-size: 15px; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover { color: var(--fg); }
  main { padding-top: 24px; padding-bottom: 56px; }
  h1 { font-size: 28px; line-height: 1.3; margin: 8px 0 16px; }
  h2 { font-size: 20px; line-height: 1.4; margin: 36px 0 8px; }
  h3 { font-size: 17px; margin: 24px 0 4px; }
  a { color: var(--accent); }
  ul { padding-left: 1.25em; }
  li { margin: 4px 0; }
  footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer .wrap { padding-top: 16px; padding-bottom: 24px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    {% if page.lang == "en" %}
    <a class="name" href="{{ '/en/' | relative_url }}">ClipMoa</a>
    <nav>
      <a href="{{ '/en/' | relative_url }}">Support</a>
      <a href="{{ '/en/privacy/' | relative_url }}">Privacy Policy</a>
      <a href="{{ '/' | relative_url }}" lang="ko">한국어</a>
    </nav>
    {% else %}
    <a class="name" href="{{ '/' | relative_url }}">ClipMoa</a>
    <nav>
      <a href="{{ '/' | relative_url }}">지원</a>
      <a href="{{ '/privacy/' | relative_url }}">개인정보처리방침</a>
      <a href="{{ '/en/' | relative_url }}" lang="en">English</a>
    </nav>
    {% endif %}
  </div>
</header>
<main class="wrap">
{{ content }}
</main>
<footer><div class="wrap">© 2026 ByoungRak Song</div></footer>
</body>
</html>
